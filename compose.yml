---
services:
  bot:
    build: .
    env_file:
      - .env
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - bot-data:/data

volumes:
  bot-data: {}
