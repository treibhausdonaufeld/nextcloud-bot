[project]
name = "nextcloud-bot"
version = "0.1.0"
description = "All kind of analytics for nextcloud"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ravyn>=0.3",
    "edgy[sqlite]>=0.32",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pillow>=11.0",
    "pandas>=2.2.2",
    "pydantic-settings>=2.5.2",
    "requests>=2.32.3",
    "sentry-sdk>=2.14.0",
    "caldav>=1.4.0",
    "pytz>=2024.2",
    "pyyaml>=6.0.2",
    "tzlocal>=5.3.1",
    "openpyxl>=3.1.5",
    "click>=8.3.0",
]

[dependency-groups]
dev = [
    "babel>=2.16.0",
    "mypy>=1.18.2",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "types-pytz>=2025.2.0.20250809",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20250913",
    "pandas-stubs>=2.3.2.250926",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
