# Time to sleep between checking mails again
sleep_minutes: 5

nextcloud:
  host: https://cloud.domain
  username: admin
  password: secret_nextcloud_password

  fetch_avatar: true
  avatar_folder: avatare
  avatar_refresh_seconds: 86400

organisation:
  # Keywords that introduce additional Matrix chat channels on a group page,
  # e.g. "Chat-Kanäle: Fragen an AG Struktur, Termine". Each name becomes a
  # public room next to the group's own one (#fragen-an-ag-struktur, ...).
  # Requires MATRIX__HOMESERVER_URL and MATRIX__ADMIN_TOKEN to be set.
  group_chat_channel_keywords:
    - chat-kanäle
    - chat-kanaele
    - chat-channels

  # Pages whose name marks an archive. A group page moved below one of them
  # counts as dissolved: the group (and every subgroup below it) is removed
  # and the roles held in it are ended, while the role history is kept.
  # "Archiv 2024" and "Archiv-2024" match as well, "Archivierung" does not.
  archive_page_names:
    - archiv
    - archive

deck_reminder:
  enabled: true
  cards_processed_storage: processed_cards.json
  notify_before_days: 3
  sleep_minutes: 720
  remind_after_days: 3

  deck_channel_mapping:
    # - board_id: 110  # AG O&E
    #   channel: ag-organisation-and-erweiterung
    - board_id: 49 # UG IT
      channel: ug-it

imap:
  host: hostname
  username: list@cloud.domain
  password: secret_imap_password

smtp:
  host: smtp.cloud.domain
  port: 587
  username: list@cloud.domain
  password: secret_smtp_password
  send_delay_seconds: 30

distribution:
  # not yet implemented
  restrict_sender: false

  # if set to true, then "Reply-To" header of the mail will be set to original sender
  reply_to_original_sender: true

  # send email also to the original sender
  send_to_sender: true

  # from-address skeleton to be adapted with original sender and recipients
  from_addr: ORIGINAL_SENDER via Treibhaus Donaufeld Mailinglist LIST_NAME

  lists:
    list@cloud.domain:
      prefix: '[THD]'
      groups:
        - Wir Alle
        - realitylab
        - Nicht-Mitglied
    list+ka@cloud.domain:
      prefix: '[THD-KA]'
      groups:
        - AG Konzept und Architektur
    list+oe@cloud.domain:
      prefix: '[THD-OE]'
      groups:
        - AG Organisation und Erweiterung
    list+rf@cloud.domain:
      prefix: '[THD-RF]'
      groups:
        - AG Recht und Finanzen
    list+dgl@cloud.domain:
      prefix: '[THD-DGL]'
      groups:
        - AG Das gute Leben
    list+ni@cloud.domain:
      prefix: '[THD-NI]'
      groups:
        - Nicht-Mitglied

# Generic notifications via Apprise (https://github.com/caronc/apprise).
# Each logical channel name is mapped to one or more Apprise service URLs.
# Channels without any Apprise target fall back to the Rocket.Chat webhook
# configured via the ROCKETCHAT__HOOK_URL environment variable.
notifier:
  enabled: true

  # optional source name shown by services that support it (defaults to the
  # configured bot name)
  # title: Nextcloud-Bot

  # override the target channel for all notifications (debugging)
  # channel_overwrite: mychannel-test

  # Apprise URLs sent for every notification, regardless of channel
  default_urls: []
  #  - "mmost://user:token@mattermost.example.com"

  # map a logical channel name to a list of Apprise service URLs
  channels: {}
  #  ug-it:
  #    - "tgram://bottoken/ChatID"
  #    - "matrixs://user:pass@matrix.example.com/#room"
  #  "@someuser":
  #    - "mailto://user:pass@example.com?to=someuser@example.com"

calendar_notifier:
  caldav_url: https://example.nextcloud/remote.php/dav/calendars/user/personal/
  enabled: true
  search_start_days: 0
  search_end_days: 7
  timezone: Europe/Vienna
  processed_storage: processed_events.json

  # channels where to post the events
  channel_keywords:
    channel-name: [kw1, keyword2]

  # When no keyword above matches, post the event in the channel of the
  # group named in its title ("AG Struktur Treffen" -> ag-struktur, which
  # is the group's own Matrix room). Set to false to notify only the
  # channels mapped above.
  group_channel_fallback: true
