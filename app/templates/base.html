<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ settings.name }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/pico.min.css" />
    <link rel="stylesheet" href="/static/app.css" />
    <script src="/static/htmx.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">{{ settings.name }}</div>
        <nav class="main-nav">
          <ul>
            <li><a href="/" {% if current_path == '/' %}aria-current="page"{% endif %}><span class="icon">🏠</span> {{ _("Home") }}</a></li>
            <li><a href="/groups" {% if current_path.startswith('/groups') %}aria-current="page"{% endif %}><span class="icon">⭕</span> {{ _("Groups") }}</a></li>
            <li><a href="/functions" {% if current_path.startswith('/functions') %}aria-current="page"{% endif %}><span class="icon">⌛</span> {{ _("Functions") }}</a></li>
            <li><a href="/milestones" {% if current_path.startswith('/milestones') %}aria-current="page"{% endif %}><span class="icon">🚩</span> {{ _("Milestones") }}</a></li>
            <li><a href="/protocols" {% if current_path.startswith('/protocols') %}aria-current="page"{% endif %}><span class="icon">📝</span> {{ _("Protocols") }}</a></li>
            <li><a href="/logbook" {% if current_path.startswith('/logbook') %}aria-current="page"{% endif %}><span class="icon">✅</span> {{ _("Logbook") }}</a></li>
            <li><a href="/mentions" {% if current_path.startswith('/mentions') %}aria-current="page"{% endif %}><span class="icon">📣</span> {{ _("Mentions") }}</a></li>
          </ul>
        </nav>
        <form class="sidebar-lang" action="/lang" method="get">
          <input type="hidden" name="next" value="{{ current_path }}" />
          <select name="code" aria-label="{{ _('Language') }}" onchange="this.form.submit()">
            {% for code, name in available_languages.items() %}
              <option value="{{ code }}" {% if code == lang %}selected{% endif %}>{{ name }}</option>
            {% endfor %}
          </select>
        </form>
      </aside>
      <div class="app-content">
        <main class="container-fluid">{% block content %}{% endblock %}</main>
      </div>
    </div>
  </body>
</html>
