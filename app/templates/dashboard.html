{% extends "base.html" %}
{% block title %}{{ _("{common_name} Dashboard").format(common_name=settings.name) }}{% endblock %}
{% block content %}
  <h1>{{ _("{common_name} Dashboard").format(common_name=settings.name) }}</h1>

  <h3>{{ _("Search") }}</h3>
  <form
    hx-get="/search"
    hx-target="#results"
    hx-trigger="input changed delay:400ms from:find input[name='q'], change from:find select, submit"
    onsubmit="return false"
  >
    <fieldset role="group">
      <input
        type="search"
        name="q"
        placeholder="{{ _('Search collective pages and decisions') }}"
        aria-label="{{ _('Search') }}"
      />
      <select name="doc_type" aria-label="{{ _('Type') }}">
        <option value="">{{ _("Pages and decisions") }}</option>
        <option value="page">{{ _("Pages") }}</option>
        <option value="decision">{{ _("Decisions") }}</option>
      </select>
      <select name="limit" aria-label="{{ _('Results') }}">
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
    </fieldset>
  </form>

  <div id="results"></div>
{% endblock %}
